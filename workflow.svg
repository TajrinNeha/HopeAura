<svg width="760" height="420" viewBox="0 0 760 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">HopeAura workflow</title>
  <desc id="desc">Workflow from SOS request to admin verification, volunteer assignment, delivery, tracking, and confirmation.</desc>
  <rect width="760" height="420" rx="28" fill="#FFFFFF"/>
  <rect x="26" y="24" width="708" height="372" rx="24" fill="#F8FBFD" stroke="#DFE7EE"/>
  <text x="380" y="58" text-anchor="middle" fill="#003049" font-size="26" font-weight="800" font-family="Arial, sans-serif">HopeAura Relief Workflow</text>
  <text x="380" y="82" text-anchor="middle" fill="#657281" font-size="13" font-family="Arial, sans-serif">Emergency request to delivery confirmation</text>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#003049" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#669BBC"/>
    </marker>
  </defs>

  <g filter="url(#shadow)">
    <rect x="62" y="126" width="112" height="92" rx="18" fill="#FFFFFF" stroke="#DFE7EE"/>
    <circle cx="118" cy="156" r="18" fill="#FCE7E7"/>
    <text x="118" y="162" text-anchor="middle" font-size="22">🆘</text>
    <text x="118" y="188" text-anchor="middle" fill="#003049" font-size="14" font-weight="800" font-family="Arial">SOS Request</text>
    <text x="118" y="206" text-anchor="middle" fill="#657281" font-size="11" font-family="Arial">Victim shares need</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="224" y="126" width="112" height="92" rx="18" fill="#FFFFFF" stroke="#DFE7EE"/>
    <circle cx="280" cy="156" r="18" fill="#E8F3FA"/>
    <text x="280" y="162" text-anchor="middle" font-size="22">✅</text>
    <text x="280" y="188" text-anchor="middle" fill="#003049" font-size="14" font-weight="800" font-family="Arial">Admin Verify</text>
    <text x="280" y="206" text-anchor="middle" fill="#657281" font-size="11" font-family="Arial">Priority checked</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="386" y="126" width="112" height="92" rx="18" fill="#FFFFFF" stroke="#DFE7EE"/>
    <circle cx="442" cy="156" r="18" fill="#EAF7F0"/>
    <text x="442" y="162" text-anchor="middle" font-size="22">🤝</text>
    <text x="442" y="188" text-anchor="middle" fill="#003049" font-size="14" font-weight="800" font-family="Arial">Volunteer</text>
    <text x="442" y="206" text-anchor="middle" fill="#657281" font-size="11" font-family="Arial">Task accepted</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="548" y="126" width="112" height="92" rx="18" fill="#FFFFFF" stroke="#DFE7EE"/>
    <circle cx="604" cy="156" r="18" fill="#FFF0DD"/>
    <text x="604" y="162" text-anchor="middle" font-size="22">🚚</text>
    <text x="604" y="188" text-anchor="middle" fill="#003049" font-size="14" font-weight="800" font-family="Arial">Delivery</text>
    <text x="604" y="206" text-anchor="middle" fill="#657281" font-size="11" font-family="Arial">Relief on the way</text>
  </g>

  <path d="M176 172H220" stroke="#669BBC" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M338 172H382" stroke="#669BBC" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M500 172H544" stroke="#669BBC" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="114" y="270" width="156" height="72" rx="18" fill="#FFFFFF" stroke="#DFE7EE"/>
    <text x="140" y="304" font-size="24">📍</text>
    <text x="178" y="298" fill="#003049" font-size="15" font-weight="800" font-family="Arial">Live Tracking</text>
    <text x="178" y="318" fill="#657281" font-size="11" font-family="Arial">Request status update</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="302" y="270" width="156" height="72" rx="18" fill="#FFFFFF" stroke="#DFE7EE"/>
    <text x="328" y="304" font-size="24">🏠</text>
    <text x="366" y="298" fill="#003049" font-size="15" font-weight="800" font-family="Arial">Shelter Finder</text>
    <text x="366" y="318" fill="#657281" font-size="11" font-family="Arial">Safe shelter support</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="490" y="270" width="156" height="72" rx="18" fill="#FFFFFF" stroke="#DFE7EE"/>
    <text x="516" y="304" font-size="24">📊</text>
    <text x="554" y="298" fill="#003049" font-size="15" font-weight="800" font-family="Arial">Analytics</text>
    <text x="554" y="318" fill="#657281" font-size="11" font-family="Arial">Transparent reports</text>
  </g>

  <path d="M604 220C604 244 568 244 568 266" stroke="#D62828" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <path d="M442 220C442 246 380 246 380 266" stroke="#669BBC" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <path d="M280 220C280 246 192 246 192 266" stroke="#669BBC" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 8" marker-end="url(#arrow)"/>

  <rect x="215" y="362" width="330" height="20" rx="10" fill="#EAF7F0"/>
  <text x="380" y="377" text-anchor="middle" fill="#1F9D63" font-size="12" font-weight="800" font-family="Arial">User confirmation completes the relief cycle</text>
</svg>
